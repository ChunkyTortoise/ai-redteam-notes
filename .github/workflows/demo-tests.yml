name: demo-tests
# Offline dispatcher demo: scripted model output, no model calls and no secrets.
# The only network use is installing the pinned pytest wheel.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==9.2.0"
      - run: python demo/dispatch_demo.py
      - run: python -m pytest -q tests
