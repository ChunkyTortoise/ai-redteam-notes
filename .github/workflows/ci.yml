name: ci
# Local-only reviewer gates: dependency-free repro, fixture benchmark, and
# tracked public-surface drift checks. No network or model calls.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reviewer repro path
        run: make repro
      - name: fixture benchmark
        run: make benchmark
      - name: public surface gate
        run: make public-surface
